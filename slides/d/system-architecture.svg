<svg viewBox="0 0 1100 525" xmlns="http://www.w3.org/2000/svg">
  
  <!-- Layer 1: Experiences (Top) -->
  <rect x="100" y="0" width="900" height="60" rx="8" fill="#E3F2FD" stroke="#1976D2" stroke-width="3"/>
  <text x="550" y="35" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#0D47A1">
    Experiences
  </text>
  
  <!-- Arrow -->
  <line x1="550" y1="60" x2="550" y2="85" stroke="#cccccc" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Layer 2: SDK (Middle) -->
  <rect x="100" y="85" width="900" height="110" rx="8" fill="#BBDEFB" stroke="#1565C0" stroke-width="3"/>
  <text x="550" y="108" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#0D47A1">
    SDK Layer
  </text>
  <text x="550" y="125" font-family="Arial" font-size="10" text-anchor="middle" fill="#1565C0">
    Runtime and business logic
  </text>
  
  <!-- Facets -->
  <rect x="200" y="140" width="300" height="42" rx="6" fill="#90CAF9" stroke="#1976D2" stroke-width="2"/>
  <text x="350" y="166" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#0D47A1">
    Facets
  </text>
  
  <!-- Core -->
  <rect x="600" y="140" width="300" height="42" rx="6" fill="#64B5F6" stroke="#1565C0" stroke-width="2"/>
  <text x="750" y="166" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#0D47A1">
    Core
  </text>
  
  <!-- Arrow -->
  <line x1="550" y1="195" x2="550" y2="220" stroke="#cccccc" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Layer 3: Cloud API -->
  <rect x="100" y="220" width="900" height="125" rx="8" fill="#64B5F6" stroke="#0D47A1" stroke-width="3"/>
  <text x="550" y="245" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#0D47A1">
    Cloud API Layer
  </text>
  <text x="550" y="263" font-family="Arial" font-size="10" text-anchor="middle" fill="#1565C0">
