<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .big-title { font-family: Arial, sans-serif; font-size: 28px; font-weight: bold; fill: #334155; }
      .title { font-family: Arial, sans-serif; font-size: 22px; font-weight: bold; fill: #475569; }
      .label { font-family: Arial, sans-serif; font-size: 15px; fill: #64748b; }
    </style>
    <filter id="shadow">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow-down" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#94a3b8" />
    </marker>
  </defs>
  
  <!-- Capabilities Layer (top, outside Social) -->
  <rect x="50" y="90" width="1100" height="75" rx="15" fill="#d1fae5" opacity="0.4" stroke="#10b981" stroke-width="3"/>
  <text x="600" y="135" text-anchor="middle" class="big-title" fill="#047857">Capabilities</text>
  
  
  <!-- Arrows down -->
  <line x1="200" y1="170" x2="200" y2="230" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow-down)" stroke-dasharray="6,3"/>
  <line x1="440" y1="170" x2="440" y2="230" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow-down)" stroke-dasharray="6,3"/>
  <line x1="680" y1="170" x2="680" y2="230" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow-down)" stroke-dasharray="6,3"/>
  <line x1="890" y1="170" x2="890" y2="230" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow-down)" stroke-dasharray="6,3"/>
  <line x1="1070" y1="170" x2="1070" y2="230" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow-down)" stroke-dasharray="6,3"/>
  
  <text x="600" y="205" text-anchor="middle" class="label" fill="#64748b" font-weight="bold">use</text>
  
  <!-- Social Service Container -->
  <rect x="50" y="240" width="1100" height="510" rx="20" fill="#dbeafe" opacity="0.3" stroke="#3b82f6" stroke-width="4" filter="url(#shadow)"/>
  <text x="600" y="290" text-anchor="middle" class="big-title" fill="#1e40af">Social</text>
  
  <!-- Core Components Layer -->
  <rect x="100" y="330" width="310" height="180" rx="12" fill="white" stroke="#60a5fa" stroke-width="3" filter="url(#shadow)"/>
  <text x="255" y="375" text-anchor="middle" font-size="40">👤</text>
  <text x="255" y="420" text-anchor="middle" class="title">Participant Profiles</text>
  <text x="255" y="445" text-anchor="middle" class="label">Activity history</text>
  <text x="255" y="465" text-anchor="middle" class="label">Progress state</text>
  <text x="255" y="485" text-anchor="middle" class="label">Performance metrics</text>
  
  <rect x="445" y="330" width="310" height="180" rx="12" fill="white" stroke="#60a5fa" stroke-width="3" filter="url(#shadow)"/>
  <text x="600" y="375" text-anchor="middle" font-size="40">👥</text>
  <text x="600" y="420" text-anchor="middle" class="title">Group Organization</text>
  <text x="600" y="445" text-anchor="middle" class="label">Roles &amp; permissions</text>
  <text x="600" y="465" text-anchor="middle" class="label">Hierarchical structures</text>
  <text x="600" y="485" text-anchor="middle" class="label">Membership management</text>
  
  <rect x="790" y="330" width="310" height="180" rx="12" fill="white" stroke="#60a5fa" stroke-width="3" filter="url(#shadow)"/>
  <text x="945" y="375" text-anchor="middle" font-size="40">💬</text>
  <text x="945" y="420" text-anchor="middle" class="title">Collaboration</text>
  <text x="945" y="445" text-anchor="middle" class="label">Chat &amp; forums</text>
  <text x="945" y="465" text-anchor="middle" class="label">Shared workspaces</text>
  <text x="945" y="485" text-anchor="middle" class="label">Notifications &amp; calendar</text>
  
  <!-- Infrastructure Foundation -->
  <rect x="100" y="550" width="1000" height="160" rx="12" fill="white" stroke="#3b82f6" stroke-width="3" filter="url(#shadow)"/>
  <text x="600" y="595" text-anchor="middle" class="title" fill="#1e40af">Participant Presence Infrastructure</text>
  <text x="600" y="630" text-anchor="middle" class="label">Engagement Tracking • Group Management • Communication Channels</text>
  <text x="600" y="655" text-anchor="middle" class="label">Activity Monitoring • Progress Visibility • Interaction Facilitation</text>
  <text x="600" y="680" text-anchor="middle" class="label">Learner Organization • Instructor Oversight • Collaborative Workflows</text>
</svg>