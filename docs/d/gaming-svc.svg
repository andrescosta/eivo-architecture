  <text x="600" y="580" text-anchor="middle" class="title" fill="#d97706">Competitive &amp; Motivational Infrastructure</text>
  <text x="600" y="615" text-anchor="middle" class="label">Performance Tracking • Ranking Systems • Reward Distribution</text>
  <text x="600" y="640" text-anchor="middle" class="label">Engagement Patterns • Motivation Mechanics</text>
  <text x="600" y="665" text-anchor="middle" class="label">Competition Management • Achievement Tracking</text>
