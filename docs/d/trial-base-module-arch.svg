<svg viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    
    <marker id="arrow-main" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-dash" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1600" height="1000" fill="#f8fafc"/>

  <text x="800" y="50" font-family="Inter, system-ui, sans-serif" font-size="32" font-weight="800" fill="#0f172a" text-anchor="middle" letter-spacing="-0.02em">Trial Base Module Architecture</text>
  <text x="800" y="80" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#64748b" text-anchor="middle">Composition-based orchestration for trial-based learning</text>

  <g transform="translate(100, 140)">
    <rect width="1400" height="160" rx="16" fill="#ffffff" filter="url(#cardShadow)" stroke="#f1f5f9" stroke-width="1"/>
    <rect width="1400" height="40" rx="16" fill="#fdf2f8"/>
    <rect y="20" width="1400" height="20" fill="#fdf2f8"/>
    <text x="20" y="26" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#be185d">CAPABILITY LAYER</text>

    <g transform="translate(30, 60)">
      <rect width="280" height="80" rx="10" fill="#fce7f3" stroke="#fbcfe8" stroke-width="1"/>
      <text x="140" y="30" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#9d174d" text-anchor="middle">Gym</text>
      <text x="140" y="55" font-family="Inter, sans-serif" font-size="11" fill="#be185d" text-anchor="middle">GymQuiz • GymCoding</text>
    </g>

    <g transform="translate(330, 60)">
      <rect width="280" height="80" rx="10" fill="#fce7f3" stroke="#fbcfe8" stroke-width="1"/>
      <text x="140" y="30" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#9d174d" text-anchor="middle">Championship</text>
      <text x="140" y="55" font-family="Inter, sans-serif" font-size="11" fill="#be185d" text-anchor="middle">ChampQuiz • ChampCoding</text>
    </g>

    <g transform="translate(630, 60)">
      <rect width="280" height="80" rx="10" fill="#fce7f3" stroke="#fbcfe8" stroke-width="1"/>
      <text x="140" y="30" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#9d174d" text-anchor="middle">Playroom</text>
      <text x="140" y="55" font-family="Inter, sans-serif" font-size="11" fill="#be185d" text-anchor="middle">GroupTrial Integration</text>
    </g>

    <g transform="translate(950, 60)">
      <rect width="420" height="80" rx="10" fill="#fdf2f8" stroke="#f9a8d4" stroke-width="1" stroke-dasharray="4,4"/>
      <text x="210" y="30" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#9d174d" text-anchor="middle">Injection Components</text>
      <text x="210" y="55" font-family="Inter, sans-serif" font-size="11" fill="#be185d" text-anchor="middle">WorkoutSelection • ChampSelection • Stats • Results</text>
    </g>
  </g>

  <g transform="translate(100, 360)">
    <rect width="700" height="150" rx="16" fill="#475569" filter="url(#cardShadow)"/>
    <text x="350" y="45" font-family="Inter, sans-serif" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">TRIAL BASE MODULE</text>
    <text x="350" y="70" font-family="Inter, sans-serif" font-size="13" fill="#cbd5e1" text-anchor="middle">Reusable Feature Orchestration (trial/solo)</text>
    
    <g transform="translate(40, 95)">
      <rect width="200" height="40" rx="8" fill="#64748b" stroke="#94a3b8"/>
      <text x="100" y="25" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="white" text-anchor="middle">QuizFeature</text>
      
      <rect x="210" y="0" width="200" height="40" rx="8" fill="#64748b" stroke="#94a3b8"/>
      <text x="310" y="25" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="white" text-anchor="middle">CodingFeature</text>
      
      <rect x="420" y="0" width="200" height="40" rx="8" fill="#475569" stroke="#94a3b8" stroke-dasharray="4,4"/>
      <text x="520" y="25" font-family="Inter, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">Slot: Custom UI</text>
    </g>
  </g>

  <g transform="translate(100, 560)">
    <rect width="320" height="150" rx="16" fill="white" filter="url(#cardShadow)" stroke="#e2e8f0"/>
    <rect width="320" height="40" rx="16" fill="#ecfeff"/>
    <text x="160" y="26" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#0891b2" text-anchor="middle">EXERCISE MODALS</text>
    <text x="160" y="70" font-family="Inter, sans-serif" font-size="11" fill="#0e7490" text-anchor="middle">FillBlank • MultiChoice • CodingTrial</text>
    <rect x="20" y="90" width="280" height="40" rx="8" fill="#f0f9ff" stroke="#bae6fd"/>
    <text x="160" y="115" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#0369a1" text-anchor="middle">User Interaction View</text>
  </g>

  <g transform="translate(460, 560)">
    <rect width="240" height="260" rx="16" fill="white" filter="url(#cardShadow)" stroke="#e2e8f0"/>
    <rect width="240" height="40" rx="16" fill="#f0fdf4"/>
    <text x="120" y="26" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#15803d" text-anchor="middle">SERVER ACTIONS</text>
    <g transform="translate(30, 65)" font-family="Monaco, monospace" font-size="12" fill="#3f6212">
      <text y="20">• start()</text>
      <text y="45">• validate()</text>
      <text y="70">• test()</text>
      <text y="95">• skip()</text>
      <text y="120">• timeout()</text>
      <text y="145">• cancel()</text>
      <text y="170">• finished()</text>
    </g>
  </g>

  <g transform="translate(740, 560)">
    <rect width="300" height="150" rx="16" fill="#10b981" filter="url(#cardShadow)"/>
    <text x="150" y="40" font-family="Inter, sans-serif" font-size="18" font-weight="800" fill="white" text-anchor="middle">CORE SDK</text>
    <text x="150" y="65" font-family="Inter, sans-serif" font-size="12" fill="#d1fae5" text-anchor="middle">Business Logic &amp; State</text>
    <rect x="20" y="85" width="260" height="45" rx="8" fill="#059669"/>
    <text x="150" y="113" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="white" text-anchor="middle">SoloTrial • GroupTrial</text>
  </g>

  <g transform="translate(1080, 560)">
    <rect width="240" height="150" rx="16" fill="white" filter="url(#cardShadow)" stroke="#e2e8f0"/>
    <rect width="240" height="40" rx="16" fill="#fffbeb"/>
    <text x="120" y="26" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#b45309" text-anchor="middle">STORAGE (REDIS)</text>
    <text x="120" y="85" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#92400e" text-anchor="middle">Session State</text>
    <text x="120" y="110" font-family="Inter, sans-serif" font-size="11" fill="#d97706" text-anchor="middle">GroupTrialSession</text>
    <text x="120" y="128" font-family="Inter, sans-serif" font-size="11" fill="#d97706" text-anchor="middle">Exercise Queue</text>
  </g>

  <g transform="translate(1360, 560)">
    <rect width="210" height="80" rx="12" fill="white" stroke="#e2e8f0" filter="url(#cardShadow)"/>
    <text x="105" y="35" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">Editorial Service</text>
    <text x="105" y="57" font-family="Inter, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Content &amp; Metadata</text>
    
    <rect y="100" width="210" height="80" rx="12" fill="white" stroke="#e2e8f0" filter="url(#cardShadow)"/>
    <text x="105" y="135" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">Assistance Service</text>
    <text x="105" y="157" font-family="Inter, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">LLM &amp; Eval</text>
  </g>

  <g fill="none" stroke-width="2">
    <path d="M 450 300 L 450 360" stroke="#64748b" marker-end="url(#arrow-main)"/>
    <path d="M 1160 300 L 800 370" stroke="#94a3b8" stroke-dasharray="6,4" marker-end="url(#arrow-dash)"/>
    <path d="M 260 510 L 260 560" stroke="#64748b" marker-end="url(#arrow-main)"/>
    <path d="M 420 635 L 460 635" stroke="#0891b2" marker-end="url(#arrow-main)"/>
    <path d="M 700 635 L 740 635" stroke="#15803d" marker-end="url(#arrow-main)"/>
    <path d="M 1040 635 L 1080 635" stroke="#94a3b8" stroke-dasharray="6,4" marker-end="url(#arrow-dash)"/>
    <path d="M 1040 595 L 1360 595" stroke="#94a3b8" stroke-dasharray="6,4" marker-end="url(#arrow-dash)"/>
  </g>

  <g transform="translate(100, 870)">
    <text font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Design Patterns</text>
    <circle cx="10" cy="30" r="4" fill="#be185d"/>
    <text x="25" y="34" font-family="Inter, sans-serif" font-size="12" fill="#475569">Composition: Injecting UI into Base Slots</text>
    <circle cx="10" cy="55" r="4" fill="#475569"/>
    <text x="25" y="59" font-family="Inter, sans-serif" font-size="12" fill="#475569">Abstraction: Base Module orchestrates generic features</text>
    <circle cx="10" cy="80" r="4" fill="#10b981"/>
    <text x="25" y="84" font-family="Inter, sans-serif" font-size="12" fill="#475569">Delegation: Stateless Actions → Stateful SDK Logic</text>
  </g>
</svg>