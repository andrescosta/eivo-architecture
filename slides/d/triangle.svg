  <!-- Second - FEATURES -->
  <polygon points="450,205 550,205 600,275 400,275" fill="#c94b6d" stroke="#b73a5d" stroke-width="2"/>
  <g opacity="0.2" transform="translate(476, 218) scale(2.0)">
