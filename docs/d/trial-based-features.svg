<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .big-title { font-family: Arial, sans-serif; font-size: 28px; font-weight: bold; fill: #334155; }
      .title { font-family: Arial, sans-serif; font-size: 22px; font-weight: bold; fill: #475569; }
      .label { font-family: Arial, sans-serif; font-size: 15px; fill: #64748b; }
    </style>
    <filter id="shadow">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#94a3b8" />
    </marker>
  </defs>
  
  <!-- Trial Capability Container -->
  <rect x="50" y="50" width="800" height="550" rx="20" fill="#e0f2fe" opacity="0.3" stroke="#0891b2" stroke-width="4" filter="url(#shadow)"/>
  <text x="450" y="100" text-anchor="middle" class="big-title" fill="#0369a1">Trial-Based Features</text>
  
  <!-- Features Layer -->
  <rect x="100" y="140" width="320" height="120" rx="15" fill="#dbeafe" stroke="#93c5fd" stroke-width="3" filter="url(#shadow)"/>
  <text x="260" y="190" text-anchor="middle" class="title">Gym</text>
  <circle cx="260" cy="230" r="25" fill="#93c5fd"/>
  <text x="260" y="242" text-anchor="middle" font-size="25" fill="white">👤</text>
  
  <rect x="480" y="140" width="320" height="120" rx="15" fill="#fef3c7" stroke="#fcd34d" stroke-width="3" filter="url(#shadow)"/>
  <text x="640" y="190" text-anchor="middle" class="title">Playroom</text>
  <g>
    <circle cx="590" cy="230" r="20" fill="#93c5fd"/>
    <text x="590" y="240" text-anchor="middle" font-size="20" fill="white">👤</text>
    <circle cx="640" cy="230" r="20" fill="#c4b5fd"/>
    <text x="640" y="240" text-anchor="middle" font-size="20" fill="white">👤</text>
    <circle cx="690" cy="230" r="20" fill="#86efac"/>
    <text x="690" y="240" text-anchor="middle" font-size="20" fill="white">👤</text>
  </g>
  
  <!-- Foundational Business Logic Layer -->
  <rect x="100" y="310" width="320" height="240" rx="15" fill="white" stroke="#0891b2" stroke-width="3" filter="url(#shadow)"/>
  <text x="260" y="355" text-anchor="middle" class="title" fill="#0369a1">Solo-Participant</text>
  <text x="260" y="385" text-anchor="middle" class="label">Individual Sessions</text>
  <text x="260" y="420" text-anchor="middle" class="label">Exercise Stream</text>
  <text x="260" y="445" text-anchor="middle" class="label">Validation Logic</text>
  <text x="260" y="470" text-anchor="middle" class="label">Error Tracking</text>
  <text x="260" y="495" text-anchor="middle" class="label">Session State</text>
  
  <rect x="480" y="310" width="320" height="240" rx="15" fill="white" stroke="#0891b2" stroke-width="3" filter="url(#shadow)"/>
  <text x="640" y="355" text-anchor="middle" class="title" fill="#0369a1">Group</text>
  <text x="640" y="385" text-anchor="middle" class="label">Synchronized Sessions</text>
  <text x="640" y="420" text-anchor="middle" class="label">Shared Exercise Stream</text>
  <text x="640" y="445" text-anchor="middle" class="label">Individual Validation</text>
  <text x="640" y="470" text-anchor="middle" class="label">Coordination Logic</text>
  <text x="640" y="495" text-anchor="middle" class="label">Per-Player State</text>
  
  <!-- Editorial Services -->
  <rect x="950" y="250" width="200" height="140" rx="15" fill="#fde68a" opacity="0.7" stroke="#f59e0b" stroke-width="3" filter="url(#shadow)"/>
  <text x="1050" y="300" text-anchor="middle" font-size="40">🤖</text>
  <text x="1050" y="340" text-anchor="middle" class="title">Editorial</text>
  <text x="1050" y="370" text-anchor="middle" class="label">Services</text>
  
  <!-- Arrow from Trial to Editorial -->
  <path d="M 850,320 L 950,320" stroke="#94a3b8" stroke-width="4" fill="none" marker-end="url(#arrow)" stroke-dasharray="8,4"/>
  <text x="900" y="310" text-anchor="middle" class="label" fill="#64748b" font-weight="bold">requests</text>
</svg>