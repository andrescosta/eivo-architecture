  </text>
  
  <!-- Controlled Infrastructure -->
  <rect x="150" y="425" width="380" height="88" rx="6" fill="#1976D2" stroke="#0D47A1" stroke-width="2"/>
  <text x="340" y="443" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle" fill="#FFFFFF">
    Controlled
  </text>
  
  <rect x="170" y="460" width="95" height="38" rx="4" fill="#1565C0" stroke="#0D47A1" stroke-width="1.5"/>
  <text x="217" y="483" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle" fill="#FFFFFF">Databases</text>
  
  <rect x="275" y="460" width="115" height="38" rx="4" fill="#1565C0" stroke="#0D47A1" stroke-width="1.5"/>
  <text x="332" y="483" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle" fill="#FFFFFF">OIDC Providers</text>
  
  <rect x="400" y="460" width="115" height="38" rx="4" fill="#1565C0" stroke="#0D47A1" stroke-width="1.5"/>
  <text x="457" y="483" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle" fill="#FFFFFF">Exec Environments</text>
  
  <!-- Non-Controlled Infrastructure -->
  <rect x="570" y="425" width="380" height="88" rx="6" fill="#1976D2" stroke="#0D47A1" stroke-width="2"/>
  <text x="760" y="443" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle" fill="#FFFFFF">
    Non-Controlled
  </text>
  
  <rect x="660" y="465" width="200" height="38" rx="4" fill="#1565C0" stroke="#0D47A1" stroke-width="1.5"/>
  <text x="760" y="488" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle" fill="#FFFFFF">AI/LLM Services</text>
  
  <!-- Arrow markers -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#cccccc"/>
    </marker>
  </defs>
</svg>
