  </text>
  
  <!-- Arrow -->
  <line x1="550" y1="345" x2="550" y2="370" stroke="#cccccc" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Layer 4: Infrastructure Providers -->
  <rect x="100" y="370" width="900" height="155" rx="8" fill="#2196F3" stroke="#0D47A1" stroke-width="3"/>
  <text x="550" y="393" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#FFFFFF">
