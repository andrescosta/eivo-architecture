  </text>
  
  <!-- API Modules -->
  <rect x="130" y="280" width="160" height="52" rx="6" fill="#42A5F5" stroke="#1976D2" stroke-width="2"/>
  <text x="210" y="310" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle" fill="#0D47A1">
    Editorial
  </text>
  
  <rect x="310" y="280" width="160" height="52" rx="6" fill="#42A5F5" stroke="#1976D2" stroke-width="2"/>
  <text x="390" y="310" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle" fill="#0D47A1">
    Assistance
  </text>
  
  <rect x="490" y="280" width="120" height="52" rx="6" fill="#42A5F5" stroke="#1976D2" stroke-width="2"/>
  <text x="550" y="310" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle" fill="#0D47A1">
    Social
  </text>
  
  <rect x="630" y="280" width="130" height="52" rx="6" fill="#42A5F5" stroke="#1976D2" stroke-width="2"/>
  <text x="695" y="310" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle" fill="#0D47A1">
    Gaming
  </text>
  
  <rect x="780" y="280" width="160" height="52" rx="6" fill="#42A5F5" stroke="#1976D2" stroke-width="2"/>
  <text x="860" y="310" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle" fill="#0D47A1">
