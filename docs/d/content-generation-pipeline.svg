<svg viewBox="0 0 1200 440" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .text { font-family: Arial, sans-serif; font-size: 14px; fill: #1e293b; }
      .title { font-family: Arial, sans-serif; font-size: 18px; font-weight: bold; fill: #1e293b; }
      .label { font-family: Arial, sans-serif; font-size: 12px; font-weight: bold; fill: #475569; }
      .flow-line { stroke: #64748b; stroke-width: 2; fill: none; }
      .box { filter: drop-shadow(0 2px 3px rgba(0,0,0,0.1)); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b" />
    </marker>
  </defs>

  <text x="600" y="40" text-anchor="middle" class="title">Content Generation Pipeline</text>

  <!-- Agent trigger -->
  <rect x="20" y="80" width="120" height="50" rx="10" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2" class="box"/>
  <text x="80" y="110" text-anchor="middle" class="text" font-weight="bold" fill="#0369a1">Agent</text>
  <text x="80" y="150" text-anchor="middle" class="label">1. TRIGGER</text>

  <!-- Human trigger -->
  <rect x="20" y="200" width="120" height="50" rx="10" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2" class="box"/>
  <text x="80" y="230" text-anchor="middle" class="text" font-weight="bold" fill="#0369a1">Human</text>
  <text x="80" y="270" text-anchor="middle" class="label">1. TRIGGER</text>

  <!-- Lines from Agent and Human converging -->
  <line x1="140" y1="105" x2="185" y2="155" class="flow-line" marker-end="url(#arrow)"/>
  <line x1="140" y1="225" x2="185" y2="175" class="flow-line" marker-end="url(#arrow)"/>

  <!-- Eivolet Definition (ADL) -->
  <rect x="190" y="130" width="160" height="60" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="2" class="box"/>
  <text x="270" y="153" text-anchor="middle" class="text" font-weight="bold">Eivolet Definition</text>
  <text x="270" y="172" text-anchor="middle" class="text">(ADL)</text>
  <text x="270" y="210" text-anchor="middle" class="label">2. DEFINE</text>

  <!-- Arrow to Platform Runtime -->
  <line x1="350" y1="160" x2="390" y2="160" class="flow-line" marker-end="url(#arrow)"/>

  <!-- Platform Runtime (first) -->
  <rect x="395" y="133" width="150" height="54" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" class="box"/>
  <text x="470" y="165" text-anchor="middle" class="text" font-weight="bold">Platform Runtime</text>
  <text x="470" y="210" text-anchor="middle" class="label">3. EXECUTE</text>

  <!-- Arrow to Logic Pack -->
  <line x1="545" y1="160" x2="580" y2="160" class="flow-line" marker-end="url(#arrow)"/>

  <!-- Logic Pack -->
  <rect x="585" y="95" width="170" height="130" rx="8" fill="white" stroke="#cbd5e1" stroke-dasharray="4"/>
  <text x="670" y="85" text-anchor="middle" class="label">LOGIC PACK</text>

  <rect x="600" y="105" width="140" height="20" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="670" y="119" text-anchor="middle" class="text" font-size="10">System Prompt</text>

  <rect x="600" y="130" width="140" height="20" rx="4" fill="#fff7ed" stroke="#f97316"/>
  <text x="670" y="144" text-anchor="middle" class="text" font-weight="bold" font-size="10">User Prompt</text>

  <rect x="600" y="155" width="140" height="20" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="670" y="169" text-anchor="middle" class="text" font-size="10">Schema</text>

  <rect x="600" y="180" width="140" height="20" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="670" y="194" text-anchor="middle" class="text" font-size="10">Context</text>

  <!-- Arrow to LLM Provider -->
  <line x1="755" y1="160" x2="800" y2="160" class="flow-line" marker-end="url(#arrow)"/>

  <!-- LLM Provider -->
  <rect x="808" y="130" width="120" height="60" rx="20" fill="#dcfce7" stroke="#16a34a" stroke-width="2" class="box"/>
  <text x="868" y="165" text-anchor="middle" class="text" font-weight="bold">LLM Provider</text>

  <!-- Arrow to Eivolet (ADL) -->
  <line x1="928" y1="160" x2="968" y2="160" class="flow-line" marker-end="url(#arrow)"/>

  <!-- Eivolet (ADL) output -->
  <rect x="973" y="130" width="150" height="65" rx="6" fill="#fef9c3" stroke="#ca8a04" stroke-width="2" class="box"/>
  <text x="1048" y="155" text-anchor="middle" class="text" font-weight="bold">Eivolet</text>
  <text x="1048" y="175" text-anchor="middle" class="text">(ADL)</text>

  <!-- Return path -->
  <path d="M1048,195 L1048,300 L470,300 L470,330" class="flow-line" marker-end="url(#arrow)"/>

  <!-- Platform Runtime (second) -->
  <rect x="395" y="330" width="150" height="50" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" class="box"/>
  <text x="470" y="360" text-anchor="middle" class="text" font-weight="bold">Platform Runtime</text>
  <text x="470" y="408" text-anchor="middle" class="label">4. STORE</text>

</svg>
