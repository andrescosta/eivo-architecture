<svg viewBox="0 0 1450 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .big-title { font-family: Arial, sans-serif; font-size: 28px; font-weight: bold; fill: #334155; }
      .title { font-family: Arial, sans-serif; font-size: 22px; font-weight: bold; fill: #475569; }
      .label { font-family: Arial, sans-serif; font-size: 15px; fill: #64748b; }
      .small-label { font-family: Arial, sans-serif; font-size: 13px; fill: #64748b; }
    </style>
    <filter id="shadow">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow-down" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#94a3b8" />
    </marker>
  </defs>
  
  <!-- Capabilities Layer (top) -->
  <rect x="50" y="50" width="1350" height="100" rx="15" fill="#d1fae5" opacity="0.4" stroke="#10b981" stroke-width="3"/>
  <text x="725" y="108" text-anchor="middle" class="big-title" fill="#047857">Capabilities Layer</text>
  <text x="725" y="135" text-anchor="middle" class="label">Aggregates • Learning • Practice • Evaluation</text>
  
  <!-- Arrows down -->
  <line x1="725" y1="160" x2="725" y2="200" stroke="#94a3b8" stroke-width="4" marker-end="url(#arrow-down)" stroke-dasharray="8,4"/>
  <text x="755" y="185" class="label" fill="#64748b" font-weight="bold">use</text>
  
  <!-- Cross-Functional Services Layer -->
  <rect x="50" y="210" width="1350" height="340" rx="20" fill="#fef3c7" opacity="0.4" stroke="#f59e0b" stroke-width="4" filter="url(#shadow)"/>
  <text x="100" y="250" class="big-title" fill="#d97706">Cross-Functional Services</text>
  
  <!-- Services - evenly distributed -->
  <rect x="92" y="280" width="220" height="120" rx="12" fill="white" stroke="#fbbf24" stroke-width="3" filter="url(#shadow)"/>
  <text x="202" y="330" text-anchor="middle" font-size="35">🤖</text>
  <text x="202" y="375" text-anchor="middle" class="title">Editorial</text>
  
  <rect x="354" y="280" width="220" height="120" rx="12" fill="white" stroke="#fbbf24" stroke-width="3" filter="url(#shadow)"/>
  <text x="464" y="330" text-anchor="middle" font-size="35">🧠</text>
  <text x="464" y="375" text-anchor="middle" class="title">Assistance</text>
  
  <rect x="615" y="280" width="220" height="120" rx="12" fill="white" stroke="#fbbf24" stroke-width="3" filter="url(#shadow)"/>
  <text x="725" y="330" text-anchor="middle" font-size="35">👥</text>
  <text x="725" y="375" text-anchor="middle" class="title">Social</text>
  
  <rect x="877" y="280" width="220" height="120" rx="12" fill="white" stroke="#fbbf24" stroke-width="3" filter="url(#shadow)"/>
  <text x="987" y="330" text-anchor="middle" font-size="35">🎮</text>
  <text x="987" y="375" text-anchor="middle" class="title">Gaming</text>
  
  <rect x="1138" y="280" width="220" height="120" rx="12" fill="white" stroke="#fbbf24" stroke-width="3" filter="url(#shadow)"/>
  <text x="1248" y="330" text-anchor="middle" font-size="35">🔐</text>
  <text x="1248" y="375" text-anchor="middle" class="title">Identity</text>
  
  <!-- Service descriptions -->
  <text x="202" y="430" text-anchor="middle" class="small-label">Content Generation</text>
  <text x="464" y="430" text-anchor="middle" class="small-label">AI Analysis</text>
  <text x="725" y="430" text-anchor="middle" class="small-label">Groups &amp; Collaboration</text>
  <text x="987" y="430" text-anchor="middle" class="small-label">Leaderboards</text>
  <text x="1248" y="430" text-anchor="middle" class="small-label">Auth &amp; Access</text>
  
  <!-- Arrows down to Infrastructure -->
  <line x1="202" y1="450" x2="202" y2="570" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow-down)" stroke-dasharray="6,3" opacity="0.5"/>
  <line x1="464" y1="450" x2="464" y2="570" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow-down)" stroke-dasharray="6,3" opacity="0.5"/>
  <line x1="725" y1="450" x2="725" y2="570" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow-down)" stroke-dasharray="6,3" opacity="0.5"/>
  <line x1="987" y1="450" x2="987" y2="570" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow-down)" stroke-dasharray="6,3" opacity="0.5"/>
  <line x1="1248" y1="450" x2="1248" y2="570" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow-down)" stroke-dasharray="6,3" opacity="0.5"/>
  
  <text x="725" y="515" text-anchor="middle" class="label" fill="#64748b" font-weight="bold">interface with</text>
  
  <!-- Infrastructure Layer -->
  <rect x="50" y="580" width="1350" height="170" rx="20" fill="#e5e7eb" opacity="0.4" stroke="#6b7280" stroke-width="4" filter="url(#shadow)"/>
  <text x="100" y="620" class="big-title" fill="#374151">Infrastructure</text>
  
  <!-- Infrastructure components - evenly distributed -->
  <rect x="100" y="650" width="240" height="70" rx="10" fill="white" stroke="#9ca3af" stroke-width="2" filter="url(#shadow)"/>
  <text x="220" y="693" text-anchor="middle" class="title">LLM Providers</text>
  
  <rect x="403" y="650" width="240" height="70" rx="10" fill="white" stroke="#9ca3af" stroke-width="2" filter="url(#shadow)"/>
  <text x="523" y="685" text-anchor="middle" class="title">Data Services</text>
  <text x="523" y="708" text-anchor="middle" class="small-label">(Databases)</text>
  
  <rect x="706" y="650" width="240" height="70" rx="10" fill="white" stroke="#9ca3af" stroke-width="2" filter="url(#shadow)"/>
  <text x="826" y="685" text-anchor="middle" class="title">OpenID Connect</text>
  <text x="826" y="708" text-anchor="middle" class="small-label">Providers</text>
  
  <rect x="1009" y="650" width="240" height="70" rx="10" fill="white" stroke="#9ca3af" stroke-width="2" filter="url(#shadow)"/>
  <text x="1129" y="685" text-anchor="middle" class="title">Cloud Platform</text>
  <text x="1129" y="708" text-anchor="middle" class="small-label">(Kubernetes)</text>
  
  <text x="1300" y="685" text-anchor="middle" class="label" fill="#64748b">Storage</text>
  <text x="1300" y="708" text-anchor="middle" class="label" fill="#64748b">Networking</text>
</svg>