    <path d="M 3,18 A 1,1 0 0 1 2,17 V 4 A 1,1 0 0 1 3,3 h 5 a 4,4 0 0 1 4,4 4,4 0 0 1 4,-4 h 5 a 1,1 0 0 1 1,1 v 13 a 1,1 0 0 1 -1,1 h -6 a 3,3 0 0 0 -3,3 3,3 0 0 0 -3,-3 z" stroke="#ffffff" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
