    <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="#ffffff" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  <text x="500" y="244" font-family="sans-serif" font-size="12px" font-weight="bold" fill="#ffffff" text-anchor="middle">FEATURES</text>
  
