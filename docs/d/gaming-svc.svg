<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .big-title { font-family: Arial, sans-serif; font-size: 28px; font-weight: bold; fill: #334155; }
      .title { font-family: Arial, sans-serif; font-size: 22px; font-weight: bold; fill: #475469; }
      .label { font-family: Arial, sans-serif; font-size: 15px; fill: #64748b; }
    </style>
    <filter id="shadow">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow-down" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#94a3b8" />
    </marker>
  </defs>
  
  <rect x="100" y="80" width="1000" height="75" rx="15" fill="#d1fae5" opacity="0.4" stroke="#10b981" stroke-width="3"/>
  <text x="600" y="127" text-anchor="middle" class="big-title" fill="#047857">Capabilities</text>
  
  <line x1="210" y1="155" x2="210" y2="215" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow-down)" stroke-dasharray="6,3"/>
  <line x1="470" y1="155" x2="470" y2="215" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow-down)" stroke-dasharray="6,3"/>
  <line x1="730" y1="155" x2="730" y2="215" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow-down)" stroke-dasharray="6,3"/>
  <line x1="990" y1="155" x2="990" y2="215" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow-down)" stroke-dasharray="6,3"/>
  
  <text x="600" y="195" text-anchor="middle" class="label" fill="#64748b" font-weight="bold">use</text>
  
  <rect x="50" y="225" width="1100" height="510" rx="20" fill="#fef3c7" opacity="0.3" stroke="#f59e0b" stroke-width="4" filter="url(#shadow)"/>
  <text x="600" y="275" text-anchor="middle" class="big-title" fill="#d97706">Gaming</text>
  
  <rect x="100" y="315" width="310" height="180" rx="12" fill="white" stroke="#fbbf24" stroke-width="3" filter="url(#shadow)"/>
  <text x="255" y="360" text-anchor="middle" font-size="40">🏆</text>
  <text x="255" y="405" text-anchor="middle" class="title">Leaderboards</text>
  <text x="255" y="430" text-anchor="middle" class="label">Rankings • Scopes</text>
  <text x="255" y="450" text-anchor="middle" class="label">Time-based competition</text>
  <text x="255" y="470" text-anchor="middle" class="label">Performance tracking</text>
  
  <rect x="445" y="315" width="310" height="180" rx="12" fill="white" stroke="#fbbf24" stroke-width="3" filter="url(#shadow)"/>
  <text x="600" y="360" text-anchor="middle" font-size="40">⚔️</text>
  <text x="600" y="405" text-anchor="middle" class="title">Competitive Arenas</text>
  <text x="600" y="430" text-anchor="middle" class="label">Matchmaking • Tournaments</text>
  <text x="600" y="450" text-anchor="middle" class="label">Head-to-head competition</text>
  <text x="600" y="470" text-anchor="middle" class="label">Skill-based pairing</text>
  
  <rect x="790" y="315" width="310" height="180" rx="12" fill="white" stroke="#fbbf24" stroke-width="3" filter="url(#shadow)"/>
  <text x="945" y="360" text-anchor="middle" font-size="40">⭐</text>
  <text x="945" y="405" text-anchor="middle" class="title">Gamification</text>
  <text x="945" y="430" text-anchor="middle" class="label">Achievements • Rewards</text>
  <text x="945" y="450" text-anchor="middle" class="label">Milestones • Streaks</text>
